name: Create YouTube Plus app

on:
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        description: "Integrate YTUHD"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

      enable_localization:
        description: "Update localization files from repo"
        type: boolean
        required: true
        default: false

      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      tweak_version:
        description: "The version of the tweak to use. Enter the version manually from dayanch96/YTLite/releases or leave default"
        default: "6.0"
        required: true
        type: string

      tweak_url:
        description: "URL to a beta YouTube Plus tweak file (Optional, used instead of the version above)"
        default: ""
        required: false
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      info_note:
        description: "TIP: Learn more about integrations in the README via the link below"
        default: "https://github.com/dayanch96/YTLite#tweak-integration-details"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YouTube Plus app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@39cfbde19b3251728d2357dd0648172d1202c1ee # v1
        with:
          exclude_inputs: bundle_id,display_name,enable_demc,enable_ryd,enable_ytabc,enable_youpip,enable_yq,enable_ytuhd,enable_localization,info_note,tweak_version

      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Build tweaks
        uses: ./.github/actions/build-tweaks
        with:
          enable_youpip: ${{ inputs.enable_youpip }}
          enable_ytuhd: ${{ inputs.enable_ytuhd }}
          enable_yq: ${{ inputs.enable_yq }}
          enable_ryd: ${{ inputs.enable_ryd }}
          enable_ytabc: ${{ inputs.enable_ytabc }}
          enable_demc: ${{ inputs.enable_demc }}
          enable_localization: ${{ inputs.enable_localization }}
          tweak_version: ${{ inputs.tweak_version }}
          tweak_url: ${{ inputs.tweak_url }}

      - name: Set release names
        id: names
        run: |
          if [ -n "${{ inputs.tweak_url }}" ]; then
            echo "file=YouTubePlus_Beta.ipa" >> $GITHUB_OUTPUT
            echo "tag=ytp-beta-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "title=YouTubePlus Beta (${{ github.run_number }})" >> $GITHUB_OUTPUT
          else
            echo "file=YouTubePlus_${{ inputs.tweak_version }}.ipa" >> $GITHUB_OUTPUT
            echo "tag=ytp-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "title=YouTubePlus v${{ inputs.tweak_version }} (${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Download and validate IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose --tries=3 --retry-connrefused -O youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Patch Info.plist
        run: |
          unzip -q youtube.ipa -d ipa_tmp
          plist="$(find ipa_tmp/Payload -maxdepth 1 -name '*.app' | head -n 1)/Info.plist"
          python3 - "$plist" <<'EOF'
          import plistlib, sys
          path = sys.argv[1]
          with open(path, 'rb') as f:
              info = plistlib.load(f)
          info.pop('UIDesignRequiresCompatibility', None)
          info['NSFaceIDUsageDescription'] = 'Face ID is required to authenticate.'
          with open(path, 'wb') as f:
              plistlib.dump(info, f, fmt=plistlib.FMT_BINARY)
          EOF
          rm youtube.ipa
          (cd ipa_tmp && zip -qry ../youtube.ipa .)
          rm -rf ipa_tmp

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip

      - name: Inject tweaks into IPA
        run: |
          tweaks="ytplus.deb OpenYouTubeSafariExtension.appex"
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i youtube.ipa -o ${{ steps.names.outputs.file }} -uwef $tweaks -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.names.outputs.tag }}
          name: ${{ steps.names.outputs.title }}
          files: ${{ steps.names.outputs.file }}
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
