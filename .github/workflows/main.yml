name: Create YouTube Plus app

on:
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        description: "Integrate YTUHD"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

      source_build:
        description: "Build YTLite from this fork's source instead of downloading the release deb"
        type: boolean
        required: true
        default: false

      enable_localization:
        description: "Use the French translation from this repo (only en and fr are kept)"
        type: boolean
        required: true
        default: false

      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      tweak_version:
        description: "YouTube Plus version (ignored with source build). 5.2b4 = last free version, 5.2.2 = needs a subscription"
        type: choice
        options:
          - "5.2.2"
          - "5.2b4"
        default: "5.2.2"
        required: true

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      info_note:
        description: "TIP: Learn more about integrations in the README via the link below"
        default: "https://github.com/dayanch96/YTLite#tweak-integration-details"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YouTube Plus IPA
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,enable_demc,enable_ryd,enable_ytabc,enable_youpip,enable_yq,enable_ytuhd,enable_localization,source_build,info_note,tweak_version

      - name: Start IPA download and cyan install
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p .logs
          nohup bash -c 'curl -fsSL --retry 3 --retry-delay 2 -o youtube.ipa "$IPA_URL" > .logs/ipa.log 2>&1 && touch .ipa.done || touch .ipa.failed' >/dev/null 2>&1 &
          nohup bash -c 'pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip > .logs/cyan.log 2>&1 && touch .cyan.done || touch .cyan.failed' >/dev/null 2>&1 &

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: src
          fetch-depth: 1

      - name: Build tweaks
        id: tweaks
        uses: ./src/.github/actions/build-tweaks
        with:
          source_dir: src
          source_build: ${{ inputs.source_build }}
          enable_youpip: ${{ inputs.enable_youpip }}
          enable_ytuhd: ${{ inputs.enable_ytuhd }}
          enable_yq: ${{ inputs.enable_yq }}
          enable_ryd: ${{ inputs.enable_ryd }}
          enable_ytabc: ${{ inputs.enable_ytabc }}
          enable_demc: ${{ inputs.enable_demc }}
          enable_localization: ${{ inputs.enable_localization }}
          tweak_version: ${{ inputs.tweak_version }}

      - name: Package IPA
        uses: ./src/.github/actions/package-ipa
        with:
          output: YouTubePlus_${{ steps.tweaks.outputs.tweak_label }}.ipa
          display_name: ${{ inputs.display_name }}
          bundle_id: ${{ inputs.bundle_id }}
          source_dir: src
          hook_report: ${{ inputs.source_build }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ytp-${{ github.run_number }}
          name: YouTubePlus v${{ steps.tweaks.outputs.tweak_label }} (${{ github.run_number }})
          files: YouTubePlus_${{ steps.tweaks.outputs.tweak_label }}.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
