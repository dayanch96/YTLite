name: Build Tweaks (Helper)

on:
  workflow_call:
    outputs:
      tweak_label:
        description: Version label of the YouTube Plus deb
        value: ${{ jobs.build-tweaks.outputs.tweak_label }}
    inputs:
      enable_youpip:
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        type: boolean
        required: true
        default: false

      enable_yq:
        type: boolean
        required: true
        default: false

      enable_ryd:
        type: boolean
        required: true
        default: false

      enable_ytabc:
        type: boolean
        required: true
        default: false

      enable_demc:
        type: boolean
        required: true
        default: false

      enable_localization:
        type: boolean
        required: true
        default: false

      source_build:
        type: boolean
        required: false
        default: false

      tweak_version:
        type: string
        required: false
        default: ""

      tweak_url:
        type: string
        required: false
        default: ""

jobs:
  build-tweaks:
    name: Build Tweaks
    runs-on: macos-15-intel
    outputs:
      tweak_label: ${{ steps.tweaks.outputs.tweak_label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: src
          fetch-depth: 1

      - name: Build tweaks
        id: tweaks
        uses: ./src/.github/actions/build-tweaks
        with:
          source_dir: src
          source_build: ${{ inputs.source_build }}
          enable_youpip: ${{ inputs.enable_youpip }}
          enable_ytuhd: ${{ inputs.enable_ytuhd }}
          enable_yq: ${{ inputs.enable_yq }}
          enable_ryd: ${{ inputs.enable_ryd }}
          enable_ytabc: ${{ inputs.enable_ytabc }}
          enable_demc: ${{ inputs.enable_demc }}
          enable_localization: ${{ inputs.enable_localization }}
          tweak_version: ${{ inputs.tweak_version }}
          tweak_url: ${{ inputs.tweak_url }}

      - name: Pack Safari extension
        run: tar -cf OpenYouTubeSafariExtension.appex.tar OpenYouTubeSafariExtension.appex

      - name: Upload built debs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: built-debs
          path: |
            *.deb
            *.appex.tar
          if-no-files-found: error
          retention-days: 1
